<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webhook Slideshow</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f5;
    --text-muted: #6b6b80;
    --accent: #6c8fff;
    --accent2: #a78bfa;
    --success: #34d399;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 1fr 320px;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .status-dot.live { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .status-label { font-size: 12px; color: var(--text-muted); }
  .count-badge {
    margin-left: auto;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-clear {
    font-size: 12px; padding: 5px 12px; border-radius: 6px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  }
  .btn-clear:hover { border-color: #e55; color: #e55; }

  /* SLIDESHOW AREA */
  .stage {
    position: relative;
    overflow: hidden;
    background: #000;
  }

  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .slide.active { opacity: 1; pointer-events: auto; }
  .slide.prev { opacity: 0; }

  .slide img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
  }

  .slide-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 32px 28px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
  }
  .slide-name { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .slide-meta { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,0.6); display: flex; gap: 16px; flex-wrap: wrap; }

  .slide-time {
    position: absolute; top: 16px; right: 16px;
    font-size: 11px; color: rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px;
  }

  /* EMPTY STATE */
  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--text-muted);
  }
  .empty-state svg { opacity: 0.2; }
  .empty-state p { font-size: 14px; }
  .empty-state code { font-size: 12px; background: var(--surface2); padding: 4px 10px; border-radius: 6px; }

  /* SLIDE CONTROLS */
  .slide-controls {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    cursor: pointer; transition: all 0.2s;
  }
  .dot.active { width: 20px; border-radius: 3px; background: #fff; }

  /* NEW BADGE */
  .new-badge {
    position: absolute; top: 16px; left: 16px;
    background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    padding: 4px 12px; border-radius: 20px;
    animation: slideIn 0.4s ease;
  }
  @keyframes slideIn { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform:none; } }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 14px 16px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .queue-list {
    flex: 1; overflow-y: auto;
    padding: 8px;
  }
  .queue-list::-webkit-scrollbar { width: 4px; }
  .queue-list::-webkit-scrollbar-track { background: transparent; }
  .queue-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .queue-item {
    display: flex; gap: 10px; align-items: center;
    padding: 10px 8px; border-radius: 8px;
    cursor: pointer; transition: background 0.15s;
    border: 1px solid transparent;
  }
  .queue-item:hover { background: var(--surface2); }
  .queue-item.active-item {
    background: var(--surface2);
    border-color: var(--accent);
  }
  .queue-thumb {
    width: 44px; height: 44px; border-radius: 6px;
    object-fit: cover; flex-shrink: 0;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 18px;
    overflow: hidden;
  }
  .queue-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .queue-info { flex: 1; min-width: 0; }
  .queue-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-idx { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }

  /* AUTO-PLAY bar */
  .autoplay-bar {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
    font-size: 12px; color: var(--text-muted);
  }
  .progress-track {
    flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 0.1s linear;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 8px; font-size: 13px;
    display: flex; align-items: center; gap: 8px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
  .toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink:0; }

  /* No-image placeholder */
  .no-img-slide {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    background: var(--surface);
  }
  .avatar-big {
    width: 120px; height: 120px; border-radius: 60px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 700; color: #fff; margin-bottom: 24px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Webhook <span>Slideshow</span></div>
  <div class="status-dot" id="statusDot"></div>
  <span class="status-label" id="statusLabel">Đang kết nối...</span>
  <div class="count-badge" id="countBadge">0 khách</div>
  <button class="btn-clear" onclick="clearAll()">Xóa tất cả</button>
</header>

<!-- MAIN STAGE -->
<div class="stage" id="stage">
  <div class="empty-state" id="emptyState">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <rect x="8" y="16" width="48" height="36" rx="4" stroke="white" stroke-width="2"/>
      <circle cx="22" cy="28" r="4" stroke="white" stroke-width="2"/>
      <path d="M8 42l14-10 10 8 8-6 14 8" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <p>Chưa có dữ liệu — đang chờ webhook</p>
    <code id="webhookUrl">POST http://&lt;server&gt;:3001/webhook</code>
  </div>
  <div id="slidesContainer"></div>
  <div class="slide-controls" id="dotsContainer"></div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">
    <span>Danh sách</span>
    <span id="queueCount">0</span>
  </div>
  <div class="queue-list" id="queueList"></div>
  <div class="autoplay-bar">
    <span>Tự chuyển</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <select id="intervalSelect" style="font-size:11px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius:4px; padding:2px 4px;">
      <option value="4000">4s</option>
      <option value="6000" selected>6s</option>
      <option value="10000">10s</option>
      <option value="0">Tắt</option>
    </select>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toastMsg"></span>
</div>

<script>
const customers = [];
let currentIndex = 0;
let autoTimer = null;
let progressTimer = null;
let progressStart = null;

const stage = document.getElementById('stage');
const slidesContainer = document.getElementById('slidesContainer');
const dotsContainer = document.getElementById('dotsContainer');
const queueList = document.getElementById('queueList');
const emptyState = document.getElementById('emptyState');
const statusDot = document.getElementById('statusDot');
const statusLabel = document.getElementById('statusLabel');
const countBadge = document.getElementById('countBadge');
const queueCount = document.getElementById('queueCount');
const progressFill = document.getElementById('progressFill');

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function renderSlides() {
  slidesContainer.innerHTML = '';
  dotsContainer.innerHTML = '';

  if (customers.length === 0) {
    emptyState.style.display = 'flex';
    countBadge.textContent = '0 khách';
    queueCount.textContent = '0';
    return;
  }
  emptyState.style.display = 'none';
  countBadge.textContent = `${customers.length} khách`;
  queueCount.textContent = customers.length;

  customers.forEach((c, i) => {
    // Slide
    const slide = document.createElement('div');
    slide.className = 'slide' + (i === currentIndex ? ' active' : '');
    slide.id = `slide-${i}`;

    if (c.imageUrl) {
      slide.innerHTML = `
        <img src="${c.imageUrl}" alt="${c.name}" onerror="this.parentNode.querySelector('.slide-overlay').style.top='50%'">
        <div class="slide-overlay">
          <div class="slide-name">${c.name}</div>
          <div class="slide-meta">
            ${c.phone ? `<span>📞 ${c.phone}</span>` : ''}
            ${c.email ? `<span>✉️ ${c.email}</span>` : ''}
            ${c.mode ? `<span>🎛️ ${c.mode}</span>` : ''}
            ${c.note ? `<span>💬 ${c.note}</span>` : ''}
            ${c.jobId ? `<span>🆔 ${c.jobId}</span>` : ''}
          </div>
        </div>
        <div class="slide-time">${formatTime(c.receivedAt)}</div>
        ${i === 0 && customers.length > 0 && c._isNew ? '<div class="new-badge">MỚI</div>' : ''}
      `;
    } else {
      slide.innerHTML = `
        <div class="no-img-slide">
          <div class="avatar-big">${getInitials(c.name)}</div>
          <div style="font-size:22px;font-weight:700">${c.name}</div>
          <div style="font-size:14px;color:var(--text-muted);margin-top:8px;display:flex;gap:16px">
            ${c.phone ? `<span>📞 ${c.phone}</span>` : ''}
            ${c.email ? `<span>✉️ ${c.email}</span>` : ''}
          </div>
          ${c.note ? `<div style="font-size:13px;color:var(--text-muted);margin-top:12px">💬 ${c.note}</div>` : ''}
        </div>
        <div class="slide-time">${formatTime(c.receivedAt)}</div>
        ${i === 0 && c._isNew ? '<div class="new-badge">MỚI</div>' : ''}
      `;
    }
    slidesContainer.appendChild(slide);

    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === currentIndex ? ' active' : '');
    dot.onclick = () => goTo(i);
    dotsContainer.appendChild(dot);
  });

  renderQueue();
  resetAutoPlay();
}

function renderQueue() {
  queueList.innerHTML = '';
  customers.forEach((c, i) => {
    const item = document.createElement('div');
    item.className = 'queue-item' + (i === currentIndex ? ' active-item' : '');
    item.onclick = () => goTo(i);
    item.innerHTML = `
      <div class="queue-thumb">
        ${c.imageUrl ? `<img src="${c.imageUrl}" alt="${c.name}">` : getInitials(c.name)}
      </div>
      <div class="queue-info">
        <div class="queue-name">${c.name}</div>
        <div class="queue-sub">${c.phone || c.email || c.mode || c.jobId || formatTime(c.receivedAt)}</div>
      </div>
      <span class="queue-idx">${i + 1}</span>
    `;
    queueList.appendChild(item);
  });
}

function goTo(index) {
  if (index < 0 || index >= customers.length) return;
  const prevSlide = document.getElementById(`slide-${currentIndex}`);
  if (prevSlide) { prevSlide.classList.remove('active'); prevSlide.classList.add('prev'); }
  currentIndex = index;
  const nextSlide = document.getElementById(`slide-${currentIndex}`);
  if (nextSlide) { nextSlide.classList.remove('prev'); nextSlide.classList.add('active'); }

  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentIndex));
  document.querySelectorAll('.queue-item').forEach((d, i) => d.classList.toggle('active-item', i === currentIndex));

  // Scroll sidebar
  const activeItem = queueList.children[currentIndex];
  if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });

  resetAutoPlay();
}

function resetAutoPlay() {
  clearInterval(autoTimer);
  clearInterval(progressTimer);
  progressFill.style.width = '0%';

  const interval = parseInt(document.getElementById('intervalSelect').value);
  if (interval === 0 || customers.length <= 1) return;

  progressStart = Date.now();
  progressTimer = setInterval(() => {
    const elapsed = Date.now() - progressStart;
    progressFill.style.width = Math.min((elapsed / interval) * 100, 100) + '%';
  }, 50);

  autoTimer = setInterval(() => {
    const next = (currentIndex + 1) % customers.length;
    goTo(next);
  }, interval);
}

document.getElementById('intervalSelect').onchange = resetAutoPlay;

function addCustomer(customer, isNew = false) {
  customer._isNew = isNew;
  // Remove existing with same id
  const existing = customers.findIndex(c => c.id === customer.id);
  if (existing !== -1) customers.splice(existing, 1);

  customers.unshift(customer);
  if (customers.length > 50) customers.pop();

  currentIndex = 0; // Show newest
  renderSlides();

  if (isNew) showToast(`Khách mới: ${customer.name}`);
}

async function clearAll() {
  if (!confirm('Xóa tất cả?')) return;
  await fetch('/api/customers', { method: 'DELETE' });
  customers.length = 0;
  currentIndex = 0;
  renderSlides();
}

// SSE
function connectSSE() {
  const es = new EventSource('/events');

  es.onopen = () => {
    statusDot.classList.add('live');
    statusLabel.textContent = 'Đang nhận webhook';
  };

  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'init') {
      data.customers.forEach(c => { c._isNew = false; customers.push(c); });
      renderSlides();
    } else if (data.type === 'new_customer') {
      addCustomer(data.customer, true);
    } else if (data.type === 'clear') {
      customers.length = 0;
      currentIndex = 0;
      renderSlides();
    }
  };

  es.onerror = () => {
    statusDot.classList.remove('live');
    statusLabel.textContent = 'Mất kết nối — đang thử lại...';
    es.close();
    setTimeout(connectSSE, 3000);
  };
}

// Set webhook URL hint
const webhookOrigin = location.origin.replace(/:3000(?=$|\/)/, ':3001');
document.getElementById('webhookUrl').textContent = `POST ${webhookOrigin}/webhook`;

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') goTo((currentIndex + 1) % Math.max(customers.length, 1));
  if (e.key === 'ArrowLeft') goTo((currentIndex - 1 + customers.length) % Math.max(customers.length, 1));
});

connectSSE();
</script>
</body>
</html>
