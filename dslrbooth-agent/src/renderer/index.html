<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Same-origin resources only (R4): this page loads no remote script, style or
  connection of any kind — every capability it has reaches the main process
  over the preload's IPC bridge, never the network.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<title>dslrBooth Agent</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main>
  <h1>dslrBooth Agent</h1>

  <section id="status-panel" aria-label="Relay status">
    <h2>Status</h2>
    <dl>
      <dt>Relay</dt><dd id="status-running">unknown</dd>
      <dt>Service socket</dt><dd id="status-socket">unknown</dd>
      <dt>Trigger port</dt><dd id="status-trigger-port">-</dd>
      <dt>dslrBooth</dt><dd id="status-dslrbooth">unknown</dd>
      <dt>Last event</dt><dd id="status-last-event">-</dd>
      <dt>Last error</dt><dd id="status-last-error">-</dd>
    </dl>
    <button type="button" id="start-button">Start</button>
    <button type="button" id="stop-button">Stop</button>
  </section>

  <section id="settings-panel" aria-label="Settings">
    <h2>Settings</h2>
    <form id="settings-form" autocomplete="off">
      <div class="field">
        <label for="extensionServiceWsUrl">Extension Service WebSocket URL</label>
        <input type="text" id="extensionServiceWsUrl" name="extensionServiceWsUrl" />
        <p class="field-error" id="error-extensionServiceWsUrl"></p>
      </div>

      <div class="field">
        <label for="extensionServiceWsToken">Extension Service token</label>
        <input type="password" id="extensionServiceWsToken" name="extensionServiceWsToken" placeholder="Leave blank to keep the stored value" />
        <p class="field-error" id="error-extensionServiceWsToken"></p>
      </div>

      <div class="field">
        <label for="dslrBoothApiPort">dslrBooth API port</label>
        <input type="number" id="dslrBoothApiPort" name="dslrBoothApiPort" min="1" max="65535" />
        <p class="field-error" id="error-dslrBoothApiPort"></p>
      </div>

      <div class="field">
        <label for="dslrBoothPassword">dslrBooth password</label>
        <input type="password" id="dslrBoothPassword" name="dslrBoothPassword" placeholder="Leave blank to keep the stored value" />
        <p class="field-error" id="error-dslrBoothPassword"></p>
      </div>

      <div class="field">
        <label for="triggerServerPort">Trigger server port</label>
        <input type="number" id="triggerServerPort" name="triggerServerPort" min="1" max="65535" />
        <p class="field-error" id="error-triggerServerPort"></p>
      </div>

      <div class="field">
        <label for="logLevel">Log level</label>
        <select id="logLevel" name="logLevel">
          <option value="error">error</option>
          <option value="warn">warn</option>
          <option value="info">info</option>
          <option value="http">http</option>
          <option value="verbose">verbose</option>
          <option value="debug">debug</option>
          <option value="silly">silly</option>
        </select>
        <p class="field-error" id="error-logLevel"></p>
      </div>

      <div class="field">
        <label for="logDir">Log directory</label>
        <input type="text" id="logDir" name="logDir" />
        <p class="field-error" id="error-logDir"></p>
      </div>

      <div class="field field-checkbox">
        <label for="autoOpenDisplay">
          <input type="checkbox" id="autoOpenDisplay" name="autoOpenDisplay" />
          Auto-open the booth display window
        </label>
      </div>

      <p id="restart-required-notice" hidden>Some changes need a restart of the relay to take effect.</p>
      <p id="save-error" role="alert"></p>
      <button type="submit" id="save-button">Save</button>
    </form>
  </section>
</main>
<script src="index.js"></script>
</body>
</html>
